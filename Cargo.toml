[package]
name = "mod-1to1earth"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). The registry dependencies below are
# pinned in Cargo.lock by `horizon-launcher native-lock .`.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
png = "0.18"
flate2 = "1"
image-webp = "0.2"
weezl = "0.1"
